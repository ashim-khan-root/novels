<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .Title }}{{ .Title }} &mdash; {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script defer>
  (function() {
    firebase.initializeApp({
      apiKey: "AIzaSyCGkJIeID4VT0RZadd1iUOnn9vOfInM8No",
      authDomain: "novels-views.firebaseapp.com",
      databaseURL: "https://novels-views-default-rtdb.firebaseio.com",
      projectId: "novels-views",
      storageBucket: "novels-views.firebasestorage.app",
      messagingSenderId: "821346640522",
      appId: "1:821346640522:web:f6b5d0efa8ff68f3c80373",
      measurementId: "G-YE8CXZB9KR"
    });
    var db = firebase.database();
    var countsRef = db.ref('counts');

    function key(p) {
      return btoa(p.replace(/\/+$/,'') || '/').replace(/=/g,'');
    }

    function updateDisplay(path, val) {
      var els = document.querySelectorAll('[data-views-for="' + path + '"]');
      for (var i = 0; i < els.length; i++) els[i].textContent = val;
    }

    document.addEventListener('DOMContentLoaded', function() {
      var page = location.pathname.replace(/\/+$/,'') || '/';
      var pageKey = key(page);

      var els = document.querySelectorAll('[data-views-for]');
      for (var i = 0; i < els.length; i++) {
        (function(el) {
          var p = el.getAttribute('data-views-for');
          var k = key(p);
          countsRef.child(k).once('value').then(function(snap) {
            var v = snap.val();
            if (v !== null) updateDisplay(p, v);
          });
        })(els[i]);
      }

      countsRef.child(pageKey).transaction(function(current) {
        return (current || 0) + 1;
      }, function(error, committed, snap) {
        if (committed && snap) updateDisplay(page, snap.val());
      });
    });
  })();
  </script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="{{ "/" | relURL }}" class="header-logo">{{ .Site.Title }}</a>

      <div class="header-search">
        <input type="text" class="search-input" id="searchInput" placeholder="Search novels..." autocomplete="off">
      </div>
    </div>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="footer">
    <div class="footer-container">
      <p>&copy; {{ now.Year }} Ashim Ahmad. All rights reserved.</p>
      <p class="footer-tagline">Stories written with love, for the world.</p>
    </div>
  </footer>
</body>
</html>

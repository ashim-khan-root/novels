<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .Title }}{{ .Title }} &mdash; {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
  <script defer>
  (function() {
    var ns = 'ashim-novels';

    function key(p) {
      return btoa(p).replace(/=/g,'');
    }

    function update(el, v) {
      var els = document.querySelectorAll('[data-views-for="' + el + '"]');
      for (var i = 0; i < els.length; i++) els[i].textContent = v;
    }

    document.addEventListener('DOMContentLoaded', function() {
      var els = document.querySelectorAll('[data-views-for]');
      var page = location.pathname.replace(/\/+$/,'') || '/';
      var pageKey = key(page);

      for (var i = 0; i < els.length; i++) {
        (function(el) {
          var p = el.getAttribute('data-views-for');
          var k = key(p);
          fetch('https://api.countapi.xyz/get/' + ns + '/' + k)
            .then(function(r) { return r.json(); })
            .then(function(d) { if (d && d.value !== undefined) update(p, d.value); })
            ['catch'](function(){});
        })(els[i]);
      }

      fetch('https://api.countapi.xyz/hit/' + ns + '/' + pageKey)
        .then(function(r) { return r.json(); })
        .then(function(d) { if (d && d.value !== undefined) update(page, d.value); })
        ['catch'](function(){});
    });
  })();
  </script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="{{ "/" | relURL }}" class="header-logo">{{ .Site.Title }}</a>

      <div class="header-search">
        <input type="text" class="search-input" id="searchInput" placeholder="Search novels..." autocomplete="off">
      </div>
    </div>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="footer">
    <div class="footer-container">
      <p>&copy; {{ now.Year }} Ashim Ahmad. All rights reserved.</p>
      <p class="footer-tagline">Stories written with love, for the world.</p>
    </div>
  </footer>
</body>
</html>
